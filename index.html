<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>School Admin Portal</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  </head>
  <body class="min-h-screen">
    <!-- Boot screen. Replaced by the app shell or the login screen once /api/me answers. -->
    <div id="boot" class="flex min-h-screen items-center justify-center p-6">
      <div class="w-full max-w-sm text-center">
        <div class="mx-auto mb-4 h-10 w-10 animate-spin rounded-full border-2 border-ink-200 border-t-brand-600"></div>
        <p class="text-sm text-ink-500">Starting the portal…</p>
        <p id="boot-error" class="mt-4 hidden text-sm text-rose-600"></p>
      </div>
    </div>

    <div id="app" class="hidden"></div>

    <!-- Toasts and modals are appended here so they escape any overflow container. -->
    <div id="overlays"></div>
    <div id="toasts" class="toast-stack pointer-events-none fixed bottom-4 right-4 z-50 flex w-full max-w-sm flex-col gap-2"></div>

    <script type="module" src="/js/app.js"></script>
    <noscript>
      <div class="p-6 text-sm">
        This portal needs JavaScript. Enable it in your browser settings, then reload.
      </div>
    </noscript>
  </body>
</html>
